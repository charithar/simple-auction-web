# SAMPLE auction file with made-up items. The real one is data/auction.yml, which is
# gitignored: copy this file there and edit it. Imported by the admin page
# (and by `npm run seed` for the emulator). Format reference: src/lib/importItems.js

auction:
  title: Sample Equipment Auction
  currency: Rs.
  minIncrement: 250       # every bid after the first must beat the current price by at least this
  maxIncrement: 5000      # guard against typos; remove for no cap
  antiSnipeSeconds: 120   # a late bid keeps the item open until 2 minutes after it
  endTime: 2026-10-31T18:00:00+05:30   # when the FIRST item closes
  stagger: 1m             # each following item closes 1 minute later (list order)

items:
