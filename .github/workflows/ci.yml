name: CI

# Tests only. The site is built and deployed from a local machine to Cloudflare
# Pages (npm run deploy:site), so no Firebase config or domains are needed here.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only tests; it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs (a moved tag can't change what runs).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Local emulator only (demo- project id); never touches a real Firebase project.
      - run: npm run test:rules

  # Browser checks: headless Chrome (preinstalled on the runner) and WebKit
  # (Playwright) drive the real app against the local emulators, seeded with the
  # committed sample auction file. Same as `npm run e2e:all` locally.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright-core install --with-deps webkit
      # Local emulators only (demo- project id); never touches a real Firebase project.
      - run: npm run e2e:all
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-screenshots
          path: test-results/browser
          retention-days: 7
