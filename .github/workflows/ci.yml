name: CI

# Tests only. The site is built and deployed from a local machine to Cloudflare
# Pages (npm run deploy:site), so no Firebase config or domains are needed here.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Local emulator only (demo- project id); never touches a real Firebase project.
      - run: npm run test:rules
